<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwasthaSaathi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Hind:wght@400;500;600&display=swap">
<style>
/* Layout concept: a printed health card. Saffron top stripe, a ruled form with a label column on wide screens, and a triage result that reads at a glance. */
:root {
  --bg: #F1F6F5;
  --surface: #FFFFFF;
  --ink: #12292B;
  --muted: #4F6568;
  --line: #CFDDDB;
  --brand: #0B6B70;
  --brand-ink: #FFFFFF;
  --stripe: #E59A2F;
  --green: #1B7F46;
  --green-bg: #E3F3E9;
  --amber: #8F5600;
  --amber-bg: #FDF0D5;
  --red: #B42323;
  --red-bg: #FBE4E2;
  --focus: #0B6B70;
  --font-display: "Baloo 2", "Hind", system-ui, sans-serif;
  --font-body: "Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1B1D; --surface: #142A2C; --ink: #E6F0EF; --muted: #9DB6B6; --line: #28474A;
    --brand: #4FC3C8; --brand-ink: #062325; --stripe: #E8A94A;
    --green: #5DD38C; --green-bg: #123222; --amber: #F2B84B; --amber-bg: #3A2B0C;
    --red: #FF8A80; --red-bg: #3C1717; --focus: #4FC3C8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1B1D; --surface: #142A2C; --ink: #E6F0EF; --muted: #9DB6B6; --line: #28474A;
  --brand: #4FC3C8; --brand-ink: #062325; --stripe: #E8A94A;
  --green: #5DD38C; --green-bg: #123222; --amber: #F2B84B; --amber-bg: #3A2B0C;
  --red: #FF8A80; --red-bg: #3C1717; --focus: #4FC3C8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
.wrap { max-width: 760px; margin: 0 auto; }
.stripe { height: 6px; background: var(--stripe); margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 20px 0 8px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.75rem; line-height: 1.1; color: var(--brand); letter-spacing: 0.2px; }
.langs { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.langs button { font: inherit; font-weight: 600; min-height: 44px; min-width: 64px; padding: 0 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.langs button + button { border-left: 1.5px solid var(--line); }
.langs button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 5.5vw, 2.4rem); line-height: 1.2; margin: 12px 0 8px; text-wrap: balance; }
.notice { margin: 0 0 8px; padding: 12px 14px; border-left: 4px solid var(--stripe); background: var(--surface); color: var(--muted); font-size: 0.95rem; }
fieldset { border: 0; border-top: 1.5px solid var(--line); margin: 28px 0 0; padding: 18px 0 0; min-width: 0; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 4px 28px; }
legend { display: contents; }
.sec-title { grid-column: 1; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; line-height: 1.25; color: var(--brand); padding-top: 2px; }
.sec-body { grid-column: 2; display: grid; gap: 16px; min-width: 0; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
label.lbl { font-weight: 600; font-size: 0.95rem; }
input[type="number"], select {
  font: inherit; width: 100%; min-height: 48px; padding: 8px 12px; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px;
}
input[aria-invalid="true"] { border-color: var(--red); }
.err { color: var(--red); font-size: 0.9rem; min-height: 0; }
.check { display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 6px 0; cursor: pointer; }
.check input { width: 24px; height: 24px; margin: 2px 0 0; flex: none; accent-color: var(--brand); }
.check span { padding-top: 1px; }
.danger { border: 1.5px solid var(--red); border-radius: 10px; padding: 8px 14px; background: var(--red-bg); }
.danger .grp { font-weight: 600; color: var(--red); margin: 6px 0 2px; }
.hint { color: var(--muted); font-size: 0.92rem; margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { font: inherit; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; min-height: 54px; padding: 0 28px; border-radius: 10px; border: 0; background: var(--brand); color: var(--brand-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); font-size: 1rem; min-height: 48px; padding: 0 18px; font-family: var(--font-body); font-weight: 600; }
#formErr { color: var(--red); font-weight: 600; margin: 0; }
#result { margin-top: 36px; scroll-margin-top: 16px; }
.banner { display: flex; gap: 16px; align-items: center; padding: 18px 20px; border-radius: 12px; border: 2px solid currentColor; }
.banner svg { flex: none; width: 48px; height: 48px; }
.banner h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.4rem, 5vw, 1.9rem); line-height: 1.2; margin: 0; }
.banner.green { color: var(--green); background: var(--green-bg); }
.banner.amber { color: var(--amber); background: var(--amber-bg); }
.banner.red { color: var(--red); background: var(--red-bg); }
.next { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.next li { padding-left: 28px; position: relative; }
.next li::before { content: ""; position: absolute; left: 4px; top: 0.6em; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
.cats { margin-top: 22px; border-top: 1.5px solid var(--line); }
.cat { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 4px 28px; padding: 14px 0; border-bottom: 1.5px solid var(--line); }
.cat h3 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; color: var(--brand); }
.pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; padding: 2px 12px 2px 10px; border-radius: 999px; font-size: 0.95rem; margin-bottom: 6px; }
.pill::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--green); background: var(--green-bg); }
.pill.warn { color: var(--amber); background: var(--amber-bg); }
.pill.bad { color: var(--red); background: var(--red-bg); }
.pill.none { color: var(--muted); background: var(--bg); border: 1px solid var(--line); }
.cat ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 0.95rem; }
.summary { margin-top: 26px; }
.summary h3 { font-family: var(--font-display); font-size: 1.1rem; margin: 0 0 4px; color: var(--brand); }
pre#sumText { margin: 8px 0 12px; padding: 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.88rem; line-height: 1.5; user-select: all; }
.method { margin-top: 36px; padding-top: 16px; border-top: 1.5px solid var(--line); color: var(--muted); font-size: 0.92rem; }
.method p { margin: 0 0 8px; }
@media (max-width: 640px) {
  fieldset, .cat { grid-template-columns: minmax(0, 1fr); }
  .sec-title, .sec-body { grid-column: 1; }
  .sec-title { margin-bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

</head>
<body>
<div class="stripe"></div>
<div class="wrap">
  <header>
    <div class="brand">SwasthaSaathi</div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिन्दी</button>
      <button type="button" data-lang="mr" aria-pressed="false" lang="mr">मराठी</button>
    </div>
  </header>
  <h1 data-i="tagline">Free health risk check in 3 minutes</h1>
  <p class="notice" data-i="notice"></p>

  <form id="form" novalidate>
    <fieldset>
      <legend><span class="sec-title" data-i="s1">About you</span></legend>
      <div class="sec-body">
        <div class="row2">
          <div class="field"><label class="lbl" for="age" data-i="age">Age</label><input type="number" id="age" inputmode="numeric" value="52"><div class="err" id="e_age"></div></div>
          <div class="field"><label class="lbl" for="sex" data-i="sex">Sex</label>
            <select id="sex"><option value="m" data-i="male">Male</option><option value="f" data-i="female">Female</option></select></div>
        </div>
        <div class="row2">
          <div class="field"><label class="lbl" for="height" data-i="height">Height</label><input type="number" id="height" inputmode="numeric" value="165"><div class="err" id="e_height"></div></div>
          <div class="field"><label class="lbl" for="weight" data-i="weight">Weight</label><input type="number" id="weight" inputmode="decimal" value="74"><div class="err" id="e_weight"></div></div>
          <div class="field"><label class="lbl" for="waist" data-i="waist">Waist</label><input type="number" id="waist" inputmode="numeric" value="98"><div class="err" id="e_waist"></div></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend><span class="sec-title" data-i="s2">Daily life and family</span></legend>
      <div class="sec-body">
        <div class="field"><label class="lbl" for="activity" data-i="activity">Physical activity</label>
          <select id="activity">
            <option value="0" data-i="a0"></option><option value="10" data-i="a1"></option>
            <option value="20" selected data-i="a2"></option><option value="30" data-i="a3"></option>
          </select></div>
        <div class="field"><label class="lbl" for="famd" data-i="famd">Family history of diabetes</label>
          <select id="famd"><option value="0" data-i="f0"></option><option value="10" selected data-i="f1"></option><option value="20" data-i="f2"></option></select></div>
        <label class="check"><input type="checkbox" id="famh"><span data-i="famh"></span></label>
        <label class="check"><input type="checkbox" id="tob"><span data-i="tob"></span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend><span class="sec-title" data-i="s3">Symptoms in the last month</span></legend>
      <div class="sec-body">
        <div>
          <label class="check"><input type="checkbox" id="sy1" checked><span data-i="sy1"></span></label>
          <label class="check"><input type="checkbox" id="sy2" checked><span data-i="sy2"></span></label>
          <label class="check"><input type="checkbox" id="sy3"><span data-i="sy3"></span></label>
          <label class="check"><input type="checkbox" id="sy4"><span data-i="sy4"></span></label>
          <label class="check"><input type="checkbox" id="sy5"><span data-i="sy5"></span></label>
        </div>
        <div class="danger">
          <div class="grp" data-i="dangerTitle"></div>
          <label class="check"><input type="checkbox" id="r1"><span data-i="r1"></span></label>
          <label class="check"><input type="checkbox" id="r2"><span data-i="r2"></span></label>
          <label class="check"><input type="checkbox" id="r3"><span data-i="r3"></span></label>
          <label class="check"><input type="checkbox" id="r4"><span data-i="r4"></span></label>
          <label class="check"><input type="checkbox" id="r5"><span data-i="r5"></span></label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend><span class="sec-title" data-i="s4">Measurements</span></legend>
      <div class="sec-body">
        <p class="hint" data-i="hint"></p>
        <div class="row2">
          <div class="field"><label class="lbl" for="sbp" data-i="sbp">Upper BP</label><input type="number" id="sbp" inputmode="numeric" value="148"><div class="err" id="e_sbp"></div></div>
          <div class="field"><label class="lbl" for="dbp" data-i="dbp">Lower BP</label><input type="number" id="dbp" inputmode="numeric" value="94"><div class="err" id="e_dbp"></div></div>
        </div>
        <div class="row2">
          <div class="field"><label class="lbl" for="glu" data-i="glu">Blood sugar</label><input type="number" id="glu" inputmode="numeric" value="118"><div class="err" id="e_glu"></div></div>
          <div class="field"><label class="lbl" for="gtype" data-i="gtype">Taken</label>
            <select id="gtype"><option value="fasting" data-i="fasting"></option><option value="random" data-i="random"></option></select></div>
        </div>
      </div>
    </fieldset>

    <div class="actions">
      <button type="submit" class="btn" id="go" data-i="go">Check my risk</button>
      <button type="button" class="btn ghost" id="reset" data-i="reset">Start again</button>
      <p id="formErr" role="alert"></p>
    </div>
  </form>

  <section id="result" aria-live="polite" hidden></section>

  <div class="method">
    <p data-i="method"></p>
    <p data-i="disclaimer"></p>
  </div>
</div>

function assess(x) {
  var bmi = x.weight / Math.pow(x.height / 100, 2);
  bmi = Math.round(bmi * 10) / 10;

  // Indian Diabetes Risk Score: age, waist, activity, family history
  var ageP = x.age < 35 ? 0 : (x.age < 50 ? 20 : 30);
  var waistP;
  if (x.sex === "m") waistP = x.waist >= 100 ? 20 : (x.waist >= 90 ? 10 : 0);
  else waistP = x.waist >= 90 ? 20 : (x.waist >= 80 ? 10 : 0);
  var idrs = ageP + waistP + x.activity + x.famd;
  var diabLevel = idrs >= 60 ? "high" : (idrs >= 30 ? "mod" : "low");

  // Blood sugar, if measured
  var gluState = "nm";
  if (x.glu !== null) {
    if (x.gtype === "fasting") gluState = x.glu >= 126 ? "dia" : (x.glu >= 100 ? "up" : "ok");
    else gluState = x.glu >= 200 ? "dia" : (x.glu >= 140 ? "up" : "ok");
  }
  if (gluState === "dia") diabLevel = "high";
  else if (gluState === "up" && diabLevel === "low") diabLevel = "mod";

  // Blood pressure, if measured
  var bpLevel = "nm";
  if (x.sbp !== null && x.dbp !== null) {
    if (x.sbp >= 140 || x.dbp >= 90) bpLevel = "high";
    else if (x.sbp >= 130 || x.dbp >= 80) bpLevel = "raised";
    else bpLevel = "normal";
  }
  var crisisBP = x.sbp !== null && (x.sbp >= 180 || x.dbp >= 120);

  // Heart risk: count of factors
  var hf = 0;
  if ((x.sex === "m" && x.age >= 45) || (x.sex === "f" && x.age >= 55)) hf++;
  if (x.tob) hf++;
  if (bpLevel === "high") hf++;
  if (diabLevel === "high") hf++;
  if (bmi >= 25) hf++;
  if (x.famh) hf++;
  if (x.activity === 30) hf++;
  var heartLevel = hf >= 4 ? "high" : (hf >= 2 ? "mod" : "low");

  var flags = x.flags.length;
  var red = flags > 0 || crisisBP || (x.gtype === "random" && x.glu !== null && x.glu >= 300);
  var amber = diabLevel === "high" || bpLevel === "high" || gluState === "up" || heartLevel === "high" ||
    (diabLevel === "mod" && x.symptoms.length >= 1) || (heartLevel === "mod" && bpLevel === "raised");
  var triage = red ? "red" : (amber ? "amber" : "green");
  var anyMod = diabLevel === "mod" || heartLevel === "mod" || bpLevel === "raised";

  var diabWhy = [["w_idrs", {n: idrs}]];
  if (gluState === "dia") diabWhy.push(["w_glu_dia", {v: x.glu}]);
  else if (gluState === "up") diabWhy.push(["w_glu_up", {v: x.glu}]);
  else if (gluState === "ok") diabWhy.push(["w_glu_ok", {v: x.glu}]);
  if (x.symptoms.length) diabWhy.push(["w_sym", {n: x.symptoms.length}]);
  var bpWhy = bpLevel === "nm" ? [["w_bpnm", {}]] : [["w_bp", {s: x.sbp, d: x.dbp}]];
  var heartWhy = [["w_bmi", {v: bmi}], ["w_hf", {n: hf}]];
  if (flags) heartWhy.unshift(["w_flag", {}]);

  var steps = [];
  if (triage === "red") steps.push("n_red1", "n_red2");
  else if (triage === "amber") steps.push("n_amber1", "n_amber2");
  else steps.push("n_green1");
  if (triage !== "red" && (gluState === "nm" || bpLevel === "nm")) steps.push("n_nm");
  if (triage !== "red") steps.push("n_life");

  return {
    x: x, bmi: bmi, idrs: idrs, hf: hf, triage: triage, anyMod: anyMod,
    cats: [
      {k: "diab", level: diabLevel, why: diabWhy},
      {k: "bp", level: bpLevel, why: bpWhy},
      {k: "heart", level: heartLevel, why: heartWhy}
    ],
    steps: steps
  };
}

  var html = '<div class="banner ' + r.triage + '">' + ICONS[r.triage] + '<h2>' + esc(T(r.triage)) + '</h2></div>';
  html += '<ul class="next">' + r.steps.map(function (k) { return "<li>" + esc(T(k)) + "</li>"; }).join("") + "</ul>";
  html += '<div class="cats">' + r.cats.map(function (c) {
    return '<div class="cat"><h3>' + esc(T(c.k)) + '</h3><div><span class="pill ' + pillClass(c.level) + '">' + esc(T(c.level)) + '</span><ul>' +
      c.why.map(function (w) { return "<li>" + esc(T(w[0], w[1])) + "</li>"; }).join("") + "</ul></div></div>";
  }).join("") + "</div>";
  html += '<div class="summary"><h3>' + esc(T("sumTitle")) + '</h3><p class="hint">' + esc(T("sumNote")) + '</p><pre id="sumText">' + esc(summaryText(r)) + '</pre><button type="button" class="btn ghost" id="copyBtn">' + esc(T("copy")) + '</button></div>';
  var el = $("result");
  el.innerHTML = html; el.hidden = false;
  $("copyBtn").onclick = function () {
    var btn = this, txt = summaryText(last);
    function done() { btn.textContent = T("copied"); setTimeout(function () { btn.textContent = T("copy"); }, 1600); }
    function fallback() {
      var range = document.createRange(); range.selectNodeContents($("sumText"));
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    }
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  };
}

$("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var f = readForm();
  $("formErr").textContent = f.ok ? "" : T("formErr");
  if (!f.ok) { $(f.first).focus(); return; }
  render(assess(f.x));
  $("result").scrollIntoView({behavior: "smooth", block: "start"});
});
$("reset").addEventListener("click", function () {
  $("form").reset();
  ["age", "height", "weight", "waist", "sbp", "dbp", "glu"].forEach(function (id) { $(id).value = ""; $("e_" + id).textContent = ""; $(id).setAttribute("aria-invalid", "false"); });
  ["sy1", "sy2"].forEach(function (id) { $(id).checked = false; });
  $("sex").value = "m"; $("activity").value = "0"; $("famd").value = "0"; $("gtype").value = "fasting";
  $("formErr").textContent = ""; $("result").hidden = true; $("result").innerHTML = ""; last = null;
  $("age").focus();
});
document.querySelectorAll(".langs button").forEach(function (b) {
  b.addEventListener("click", function () { applyLang(b.getAttribute("data-lang")); });
});

var saved = "en";
try { saved = localStorage.getItem("ss-lang") || "en"; } catch (e) {}
applyLang(I18N[saved] ? saved : "en");
</script>
